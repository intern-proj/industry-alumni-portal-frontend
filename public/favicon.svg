<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="nicGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="nicGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF" />
  <rect width="128" height="128" rx="28" fill="url(#nicGrad1)" opacity="0.05" />
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#E2E8F0" stroke-width="2" />

  <!-- NIC Unit Interlocking Nodes Emblem -->
  <g filter="url(#glow)" transform="translate(14, 14)">
    <!-- Primary Green Loop (N / Bridge) -->
    <path d="M22 68 C 14 68, 8 58, 8 46 C 8 30, 22 18, 38 18 C 50 18, 58 26, 62 36" 
          stroke="url(#nicGrad1)" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M22 68 L 38 32 C 42 22, 52 18, 62 36" 
          stroke="url(#nicGrad1)" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Secondary Cyan Loop (C / Growth Arrow) -->
    <path d="M42 62 C 46 72, 56 80, 70 80 C 86 80, 96 66, 92 50 C 90 40, 80 32, 70 32" 
          stroke="url(#nicGrad2)" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Trajectory Arrow -->
    <line x1="52" y1="52" x2="88" y2="16" stroke="url(#nicGrad2)" stroke-width="9" stroke-linecap="round" />
    <polygon points="88,6 98,16 88,26 84,16" fill="url(#nicGrad2)" />

    <!-- Collaboration Nodes -->
    <circle cx="22" cy="44" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="50" cy="46" r="6.5" fill="#FFFFFF" stroke="#10B981" stroke-width="3.5" />
    <circle cx="68" cy="48" r="7" fill="#06B6D4" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="86" cy="62" r="6" fill="#0284C7" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>